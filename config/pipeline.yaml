pipeline_id: sosi-2026
version: 2.3
assessment_year: 2023
previous_assessment_year: 2021

authentication:
  google:
    service_account:
      api_version: v3
      cred_path_env_var: GOOGLE_SERVICE_ACCOUNT_CREDENTIALS_PATH
      service_account_email: drive-pipeline-reader@my-gcp-project.iam.gserviceaccount.com
      scopes:
        sheets: 
          - https://www.googleapis.com/auth/spreadsheets
        drive:
          - https://www.googleapis.com/auth/drive.readonly
    oauth:
      cred_path_env_var: GOOGLE_OAUTH_CREDENTIALS_PATH
extraction:
  SOSI_2026_workspace:
    source_type: sheets
    tables:
      sosi2026:
        file_name: SoSI2026-Master-Frozen
        sheet_name: sosi2026
      sosi2025:
        file_name: SoSI2026-Master-Frozen
        sheet_name: sosi2025
  capture_zip:
    source_type: zip
    url: https://www.fao.org/fishery/static/Data/Capture_2025.1.0.zip
    tables:
      capture: 
        file_name: Capture_Quantity.csv
      countries: 
        file_name: CL_FI_COUNTRY_GROUPS.csv
      fao_areas: 
        file_name: CL_FI_WATERAREA_GROUPS.csv
  aquaculture_zip:
    source_type: zip
    url: https://www.fao.org/fishery/static/Data/Aquaculture_2025.1.0.zip
    tables: 
      aquaculture: 
        file_name: Aquaculture_Quantity.csv
  asfis_zip:
    source_type: zip
    url: https://www.fao.org/fishery/static/ASFIS/ASFIS_sp.zip
    tables:
      asfis: 
        file_name: ASFIS_sp_2025.csv
transformation:
  editions:
    2026: 2023
    2025: 2021
  schema:
    aquaculture:
      file_name: aquaculture.yaml
      key: info
    asfis:
      file_name: asfis.yaml
      key: info
    capture:
      file_name: capture.yaml
      key: info
    countries:
      file_name: countries.yaml
      key: info
    fao_areas:
      file_name: fao_areas.yaml
      key: info
    sosi2025:
      file_name: stock_assessments.yaml
      key: sosi
      stock_sheet: True
    sosi2026:
      file_name: stock_assessments.yaml
      key: sosi
      stock_sheet: True
  years:
    first: 1950
    last: 2023
  isscaap_to_exclude: [61, 62, 63, 64, 71, 72, 73, 74, 81, 82, 83, 91, 92, 93, 94]
plotting:
  species_to_exclude: [MZZ]
  show_figure: False
loading:
  folder_id: 14rICsJgvdX_F6_orFH_j0jnwdD0zgwAO
  branch_env_var: BRANCH
  db_env_var: NEON_DATABASE_URL
  figures:
    extension: pdf
    dpi: 300
  tables:
    extension: xlsx
    save_index: 
      sosi: False
      output: True
    replace_on_exists: True


