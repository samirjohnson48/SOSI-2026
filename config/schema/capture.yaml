columns:
  AREA.CODE:
    dtype: Int64
    rename: fao_area
  COUNTRY.UN_CODE:
    dtype: Int64
    rename: country_un_code
  MEASURE:
    dtype: string
    rename: unit
    restrictions:
      - [check_tlw, filter]
  PERIOD:
    dtype: Int64
    rename: year
    restrictions:
      - [not_na, filter]
  SPECIES.ALPHA_3_CODE:
    dtype: string
    rename: asfis_code
  VALUE:
    dtype: float64
    rename: production
primary_key:
  - country_un_code
  - asfis_code
  - fao_area
  - year
create_id:
  method: uid
