name: SOSI 2026 Data Pipeline

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14' 
          cache: 'pip'           

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Decode and Create Google Credentials File
        run: |
          echo "${{ secrets.GSA_CREDENTIALS_BASE64 }}" | base64 --decode > gsa_credentials.json

      - name: Run SOSI Pipeline
        env:
          DROPBOX_TOKEN: ${{ secrets.DROPBOX_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_CREDENTIALS_PATH: ${{ github.workspace }}/gsa_credentials.json
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          PIPELINE_VERSION: "v1.0_auto"
        run: python3 -m src.main
