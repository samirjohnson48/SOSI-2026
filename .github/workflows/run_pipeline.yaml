name: SOSI 2026 Data Pipeline

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14' 
          cache: 'pip'           

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Decode and Create Google Credentials File
        run: |
          echo "${{ secrets.GSA_CREDENTIALS_BASE64 }}" | base64 --decode > gsa_credentials.json

      - name: Run SOSI Pipeline
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_CREDENTIALS_PATH: ${{ github.workspace }}/gsa_credentials.json
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: python3 -m src.main

      - name: Upload Logs as Artifacts
        if: always() 
        uses: actions/upload-artifact@v4
        with:
          name: execution-logs
          path: logs/*.log
          retention-days: 5 
