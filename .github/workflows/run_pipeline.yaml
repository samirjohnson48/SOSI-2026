name: SOSI 2026 Data Pipeline

on:
  workflow_dispatch:
    inputs:
      load_files:
        description: "Figures and tables to load (space-separated, or leave blank for all)"
        required: False
        default: ''
      log_level:
        description: "Set log verbosity"
        type: choice
        options:
          - DEBUG
          - INFO
          - WARNING
        default: 'INFO'

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14' 
          cache: 'pip'           

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Cache Processed Tables
          uses: actions/cache@v4
          with:
            path: .cache/  
            key: tables-${{ github.ref_name }}-${{ github.run_id }}
            restore-keys: |
              tables-${{ github.ref_name }}-

      - name: Decode and Create Google Credentials File
        run: |
          echo "${{ secrets.GSA_CREDENTIALS_BASE64 }}" | base64 --decode > gsa_credentials.json
          echo "${{ secrets.GOOGLE_OAUTH_CREDENTIALS_BASE64 }}" | base64 --decode > google_oauth_credentials.json

      - name: Run SOSI Pipeline
        env:
          GOOGLE_OAUTH_CREDENTIALS_PATH: ${{ github.workspace }}/google_oauth_credentials.json
          GOOGLE_SERVICE_ACCOUNT_CREDENTIALS_PATH: ${{ github.workspace }}/gsa_credentials.json
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          LOG_LEVEL: ${{ github.events.input.log_level }}
          FILES_TO_LOAD: ${{ github.events.input.load_files }}
        run: |
          if [ -z "$FILES_TO_LOAD" ]; then
            python -m src.main -l "$FILES_TO_LOAD"
          else
            python -m src.main -l
          fi

      - name: Upload Logs as Artifacts
        if: always() 
        uses: actions/upload-artifact@v4
        with:
          name: execution-logs
          path: logs/*.log
          retention-days: 5 
